[workspace]
resolver = "2"
members = [
    "broker",
    "client",
    "storage",
    "query",
    "common",
    "client",
    "common"]

[workspace.dependencies]
common = { path = "common" }

anyhow = "1.0.104"
bytes = "1.12.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = "0.23.43"
tokio = { version = "1.53.1", features = ["net", "macros", "rt-multi-thread", "io-util", "time", "sync"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.19", features = ["codec"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }
serde = "1.0.229"
postcard = { version = "1.1.3", features = ["alloc"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"]}
tracing-appender = "0.2.5"